name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run

  app:
    # Boots the real stack the way the README does: local Supabase in Docker
    # (migrations + seed.sql), `pnpm setup:env`, the CSV load, a production
    # build, then requests the data table from the running server and runs the
    # exercise evals against it (evals/README.md).
    # The name is a required check in the "main: CI must pass" ruleset; keep it.
    name: Supabase + build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub runners often hit the anonymous pull quota on public.ecr.aws
      # (the CLI's default registry). Docker Hub hosts the same images.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      # The app doesn't use these; skip their containers and schema setup.
      SUPABASE_REALTIME_ENABLED: "false"
      SUPABASE_STORAGE_ENABLED: "false"
      # Page the smoke test loads, and text that must be in its HTML. A 200
      # alone doesn't prove much: with cacheComponents the static shell is
      # sent before any query runs. These point at the data table sorted by
      # caffeine, highest first, and at the caffeine value of its first row
      # (ID 1865), the largest in the CSV. No label, count, or filter control
      # shows that number. The match is against raw HTML, where React puts
      # <!-- --> between adjacent JSX expressions and escapes & ' " < >.
      SMOKE_PATH: /?sort=-caffeine_mg
      SMOKE_EXPECT: "780.3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations and seed.sql)
        # Only the services the app talks to: Postgres, PostgREST, Auth, Kong.
        run: pnpm exec supabase start -x edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector

      - name: Lint database (plpgsql errors)
        run: pnpm exec supabase db lint --level error --fail-on error

      - name: Write .env.local
        run: pnpm setup:env

      - name: Load the dataset
        # Fails unless the table's row count equals the CSV's.
        run: pnpm db:load

      - name: Verify pagination
        # Pages through getPage() for every sort and 100 random filter views
        # and compares with the CSV. Before the evals, whose --scale case
        # adds rows. See .agents/skills/verify-coffee-health-pagination/.
        run: pnpm verify:pagination

      - run: pnpm build

      - name: Smoke test the running app
        run: |
          pnpm start > next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 5 http://localhost:3000/ && break
            sleep 1
          done
          status=$(curl -sS --max-time 30 -o page.html -w '%{http_code}' "http://localhost:3000${SMOKE_PATH}" || true)
          [ "${status:-000}" = 000 ] && status="no response"
          echo "GET ${SMOKE_PATH} -> ${status} ($(wc -c < page.html 2>/dev/null || echo 0) bytes)"
          if [ "$status" != 200 ]; then
            echo "::error::GET ${SMOKE_PATH} returned ${status}, expected 200"
            exit 1
          fi
          if ! grep -qF -- "$SMOKE_EXPECT" page.html; then
            echo "::error::GET ${SMOKE_PATH} is missing the expected text: ${SMOKE_EXPECT}"
            exit 1
          fi

      - name: Exercise evals
        # Uses the server the smoke test started. Fails when a case differs
        # from the committed baseline in either direction.
        run: pnpm evals:exercise --out evals/runs/ci --scale --baseline evals/exercise/baseline.json

      - name: Eval summary
        if: always()
        run: cat evals/runs/ci/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Server log
        if: always()
        run: cat next.log 2>/dev/null || true
